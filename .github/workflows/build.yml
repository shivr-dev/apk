name: Build Watch APK
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_LICENSE_ACCEPT: yes
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装正确版本的JDK和Gradle（AGP 8.7必须用Gradle 8.9）
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-write-only: false

      # 2. 自动生成完整的Gradle Wrapper（解决你没有gradlew的问题）
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ls -la ./gradlew

      # 3. 安装Android SDK 36（你的项目用的最新SDK）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      # 4. 创建Secrets插件需要的.env文件（否则会报错）
      - name: Create .env file
        run: touch .env

      # 5. 强制生成32位APK（OPPO Watch X唯一支持的架构）
      - name: Add 32-bit ABI filter
        run: |
          sed -i '/defaultConfig {/a\        ndk {\n            abiFilters.clear()\n            abiFilters += "armeabi-v7a"\n        }' app/build.gradle.kts

      # 6. 构建Debug APK（用你配置好的debug签名）
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      # 7. 上传APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-32bit
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
