name: Build Watch APK
on:
  workflow_dispatch:

env:
  # 强制使用Node24，消除警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 自动接受所有Android SDK许可证
  ANDROID_LICENSE_ACCEPT: yes
  # 禁用Gradle守护进程，避免CI环境内存问题
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用官方Gradle Action，自动处理JDK和缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: 17
          distribution: temurin
          cache-write-only: false

      # 最新版setup-android已原生支持Node24
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 安装你项目需要的SDK版本（根据你的build.gradle调整）
          packages: "platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      # 修复gradlew执行权限（最容易被忽略的问题）
      - name: Fix Gradle Permissions
        run: |
          chmod +x ./gradlew
          ls -la ./gradlew

      # 先清理旧构建，再编译，同时打印完整错误日志
      - name: Build 32-bit Debug APK
        run: ./gradlew clean assembleDebug --info --stacktrace

      # 上传APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-32bit
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
